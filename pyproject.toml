[project]
name = "faxineiro"
version = "0.1.0"
description = "Organizador pessoal de arquivos com IA local"
requires-python = ">=3.11"
dependencies = [
    "puremagic>=2.0",
    "blake3>=1.0",
    "pypdf>=4.0",
    "PySide6-Essentials>=6.8",
    "Pillow>=11",
    "pillow-heif>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.11"]  # pyinstaller: gera o .exe (Fase 7B)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
